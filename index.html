<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mappa Camping Live</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        #status { padding: 10px 20px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: bold; background: #2ecc71; color: white; }

        /* Contenitore Mappa */
        .mappa-container { 
            position: relative; 
            display: inline-block; 
            background: white; 
            padding: 10px; 
            border-radius: 10px; 
        }
        
        #mappa-img { 
            display: block; 
            max-width: 1000px; /* Larghezza fissa per stabilità */
            height: auto; 
        }

        /* Tasto Piazzola - Creato come un rettangolo sopra l'immagine */
        .area-cliccabile {
            position: absolute;
            background: rgba(46, 204, 113, 0.2); /* Colore verde leggerissimo per vedere dove clicchi */
            border: 1px solid rgba(46, 204, 113, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: black;
            font-weight: bold;
        }
        .area-cliccabile:hover { background: rgba(46, 204, 113, 0.5); }

        /* Posizione esatta Piazzola 26 (Percentuale per non farla muovere mai) */
        #p26 { top: 41%; left: 18.5%; width: 3.5%; height: 3%; }

        /* Popup */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { background: white; color: #333; margin: 10% auto; padding: 25px; width: 280px; border-radius: 20px; text-align: left; }
        .chiudi { float: right; font-size: 30px; cursor: pointer; color: #ccc; }
        h2 { color: #2ecc71; margin-top: 0; }
    </style>
</head>
<body>

    <div id="status">SINCRONIZZAZIONE...</div>
    <h1>Mappa Camping Live</h1>

    <div class="mappa-container">
        <img src="mappa.jpg.jpeg.jpeg" id="mappa-img">
        
        <div id="p26" class="area-cliccabile" onclick="apriScheda('26')">26</div>
    </div>

    <div id="popup" class="modal">
        <div class="modal-content">
            <span class="chiudi" onclick="chiudi()">&times;</span>
            <h2 id="p_num">Piazzola --</h2>
            <hr>
            <p><strong>Nome:</strong> <br><span id="p_nome" style="font-size:1.2em">---</span></p>
            <p><strong>Telefono:</strong> <br><span id="p_tel">---</span></p>
            <p><strong>Contatore:</strong> <br><span id="p_cont">---</span></p>
        </div>
    </div>

    <script>
        let foglioDati = {};
        const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRn2t2WS-_S4mGcfv9uf0ogf0G7ddF1RYCSYJBNlAACzjTO4BJSNt5edIkc9VdMlBBOxWWDf0jbxt4u/pub?output=csv";

        async function caricaDati() {
            try {
                const response = await fetch(urlCSV + "&t=" + Date.now());
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        results.data.forEach(r => {
                            let n = r["Numero"] || r["numero"];
                            if(n) foglioDati[n.toString().trim()] = r;
                        });
                        document.getElementById('status').innerText = "✓ SISTEMA PRONTO";
                    }
                });
            } catch (e) { console.log("Errore connessione"); }
        }

        function apriScheda(n) {
            const d = foglioDati[n];
            document.getElementById('p_num').innerText = "Piazzola " + n;
            document.getElementById('p_nome').innerText = d ? (d["Nome"] || d["nome"] || "LIBERA") : "LIBERA";
            document.getElementById('p_tel').innerText = d ? (d["Telefono"] || d["telefono"] || "---") : "---";
            document.getElementById('p_cont').innerText = d ? (d["Contatore"] || d["contatore"] || "---") : "---";
            document.getElementById('popup').style.display = "block";
        }

        function chiudi() { document.getElementById('popup').style.display = "none"; }
        window.onclick = function(e) { if(e.target == document.getElementById('popup')) chiudi(); }
        
        caricaDati();
        setInterval(caricaDati, 15000); 
    </script>
</body>
</html>
