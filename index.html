<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mappa Live Camping</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        #status { padding: 10px; margin: 10px; border-radius: 20px; display: inline-block; font-weight: bold; }
        .ok { background: #2ecc71; }
        .errore { background: #e74c3c; }
        .mappa-container { position: relative; display: inline-block; background: white; padding: 10px; border-radius: 10px; }
        img { display: block; max-width: 100%; height: auto; border: 1px solid #ccc; }
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { background: white; color: #333; margin: 10% auto; padding: 25px; width: 280px; border-radius: 20px; text-align: left; }
        .chiudi { float: right; font-size: 30px; cursor: pointer; color: #ccc; }
    </style>
</head>
<body>

    <div id="status">Connessione...</div>
    <h1>Mappa Gestionale Live</h1>

    <div class="mappa-container">
        <img src="mappa.jpg.jpeg.jpeg" usemap="#image-map">
        
        <map name="image-map">
            <area shape="rect" coords="182,415,216,442" href="javascript:void(0)" onclick="apriScheda('26')" alt="26">
        </map>
    </div>

    <div id="popup" class="modal">
        <div class="modal-content">
            <span class="chiudi" onclick="chiudi()">&times;</span>
            <h2 id="p_num" style="color:#2ecc71">Piazzola --</h2>
            <p><strong>Nome:</strong> <span id="p_nome">---</span></p>
            <p><strong>Telefono:</strong> <span id="p_tel">---</span></p>
            <p><strong>Contatore:</strong> <span id="p_cont">---</span></p>
        </div>
    </div>

    <script>
        let foglioDati = {};
        const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRn2t2WS-_S4mGcfv9uf0ogf0G7ddF1RYCSYJBNlAACzjTO4BJSNt5edIkc9VdMlBBOxWWDf0jbxt4u/pub?output=csv";

        async function caricaDati() {
            try {
                const response = await fetch(urlCSV + "&t=" + Date.now());
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        results.data.forEach(r => {
                            let n = r["Numero"] || r["numero"];
                            if(n) foglioDati[n.toString().trim()] = r;
                        });
                        document.getElementById('status').innerText = "✓ DATI SINCRONIZZATI";
                        document.getElementById('status').className = "ok";
                    }
                });
            } catch (e) {
                document.getElementById('status').innerText = "ERRORE CONNESSIONE";
                document.getElementById('status').className = "errore";
            }
        }

        function apriScheda(n) {
            const d = foglioDati[n];
            document.getElementById('p_num').innerText = "Piazzola " + n;
            document.getElementById('p_nome').innerText = d ? (d["Nome"] || d["nome"] || "---") : "Libera";
            document.getElementById('p_tel').innerText = d ? (d["Telefono"] || d["telefono"] || "---") : "---";
            document.getElementById('p_cont').innerText = d ? (d["Contatore"] || d["contatore"] || "---") : "---";
            document.getElementById('popup').style.display = "block";
        }

        function chiudi() { document.getElementById('popup').style.display = "none"; }
        window.onclick = function(e) { if(e.target == document.getElementById('popup')) chiudi(); }
        
        caricaDati();
        setInterval(caricaDati, 15000); // Aggiorna ogni 15 secondi
    </script>
</body>
</html>
